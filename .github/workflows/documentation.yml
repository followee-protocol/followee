name: Documentation

on:
  pull_request:
    paths:
      - "**.md"
      - "scripts/check_cross_references.py"
      - ".github/workflows/documentation.yml"
  push:
    branches:
      - main
    paths:
      - "**.md"
      - "scripts/check_cross_references.py"
      - ".github/workflows/documentation.yml"

permissions:
  contents: read

jobs:
  cross-references:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Test checker
        run: python3 scripts/check_cross_references.py --self-test
      - name: Check document cross-references
        run: >-
          python3 scripts/check_cross_references.py
          Followee-Specification.md
          Followee-Whitepaper.md
